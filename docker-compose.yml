services:
  db:
    image: postgres:17
    container_name: medlink_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medlink}
      POSTGRES_USER: ${POSTGRES_USER:-medlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medlink}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medlink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medlink} -d ${POSTGRES_DB:-medlink}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  medlink_pgdata:
