{% extends "base.html" %}

{% block body %}
<main class="mx-auto flex max-w-3xl flex-col gap-6 p-8">
  <h1 class="text-4xl font-extrabold tracking-tight">Medlink is running.</h1>

  <div class="panel flex flex-col gap-4">
    <p class="text-ink-soft">Signed in as <strong class="text-ink">{{ request.user }}</strong>.</p>
    <div class="flex flex-wrap gap-3">
      <a href="/health/" class="btn-primary">Check health</a>
      <a href="/admin/" class="btn-quiet">Open admin</a>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn-quiet cursor-pointer">Sign out</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
